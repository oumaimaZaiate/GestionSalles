<form class="app-form" [formGroup]="form" (ngSubmit)="createSalle()">

  <div class="app-field">
    <label for="intitule">Intitulé</label>
    <input id="intitule" type="text" formControlName="intitule">
  </div>

  <div class="app-field-row">
    <div class="app-field">
      <label for="capacite">Capacité</label>
      <input id="capacite" type="number" formControlName="capacite">
    </div>

    <div class="app-field">
      <label for="capacite_exam">Capacité examen</label>
      <input id="capacite_exam" type="number" formControlName="capacite_exam">
    </div>
  </div>

  <div class="app-field">
  <label for="categorie">Catégorie</label>
  <select id="categorie" formControlName="categorie" class="form-select">
    <option value="">catégorie</option>
    <option *ngFor="let cat of categories" [value]="cat">
      {{ cat }}
    </option>
  </select>
</div>

  <div class="app-field-row">
    <div class="app-field">
      <label for="surface">Surface</label>
      <input id="surface" type="number" formControlName="surface">
    </div>

   <div class="app-field">
  <label for="etage">Étage</label>
  <select id="etage" formControlName="etage" class="form-select">
    <option value="">étage</option>
    <option *ngFor="let e of etages" [value]="e">
      {{ e === -1 ? 'Sous-sol (-1)' : e === 0 ? 'Rez-de-chaussée (0)' : 'Étage ' + e }}
    </option>
  </select>
</div>
  </div>

      <div class="app-field-row">
      <div class="app-field">
      <label for="faculteId">Faculté</label>
      <select id="faculteId" formControlName="faculteId" class="form-select">
      <option value="">faculté</option>

      <option *ngFor="let faculte of facultes" [value]="faculte.id">
      {{ faculte.intitule }}
      </option>
      </select>    </div>   

      <div class="app-field">
      <label for="batimentId">Bâtiment</label>
      <select id="batimentId" formControlName="batimentId" class="form-select">
      <option value="">bâtiment</option>

  <option *ngFor="let batiment of batiments" [value]="batiment.id">
    {{ batiment.intitule }}
  </option>
</select>  
  </div>
  </div>

<div class="app-field">
  <div class="spec-header">
  <label for="specifications">Spécifications</label>
  <button type="button" class="spec-add-btn" (click)="OpenSpecDialog()">
    + Ajouter
  </button>
  </div>
  <div class="spec-scroll-panel">
<div class="spec-item" *ngFor="let spec of selectedSpecifications">
<span> {{ spec.nom }} </span>
</div>
<div class="spec-empty" *ngIf="selectedSpecifications.length === 0">
        Aucune spécification sélectionnée
</div>
</div>
</div>

  <div class="app-form-actions">
    <button type="button" (click)="onCancel()">Annuler</button>
    <button type="submit" [disabled]="form.invalid  || saving">  {{ saving ? 'Enregistrement...' : 'Enregistrer' }}</button>
  </div>
  <br>
</form>
<igx-dialog #specDialog title="Ajouter des spécifications"  closeOnOutsideSelect="true">
<div class="spec-checklist">
  <div class="spec-checklist-item" *ngFor="let spec of specificationsSorted">
    <label>
      <input type="checkbox"
      [checked]="tempSpecifications.includes(spec)"
      (change)="toggleTempSpec(spec)"> {{spec.nom}} </label>
  </div>
</div>
<div class="spec-dialog-actions">
    <button type="button" (click)="closeSpecDialog()">Annuler</button>
    <button type="button" (click)="confirmSpecs()">Ajouter</button></div>
</igx-dialog>
