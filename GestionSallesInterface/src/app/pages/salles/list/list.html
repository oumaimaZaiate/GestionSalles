<igx-grid
    #grid
    [data]="salles"
    [autoGenerate]="false"
    [allowFiltering]="true"
    primaryKey="id"
    width="100%"
    height="600px"
    (rowMouseEnter)="actionStrip.show($event)"
    (rowMouseLeave)="actionStrip.hide()">

      <igx-grid-toolbar>
          <igx-grid-toolbar-title>Salles</igx-grid-toolbar-title>
          <igx-grid-toolbar-actions>
              <igx-grid-toolbar-hiding></igx-grid-toolbar-hiding>
              <igx-grid-toolbar-pinning></igx-grid-toolbar-pinning>
              <igx-grid-toolbar-exporter></igx-grid-toolbar-exporter>
               <button igxButton="contained" (click)="openCreateDialog()">
      <igx-icon>add</igx-icon>
      Ajouter une salle
    </button>
          </igx-grid-toolbar-actions>
      </igx-grid-toolbar>

      <igx-column field="intitule" header="Intitulé" [sortable]="true" [resizable]="true"></igx-column>
      <igx-column field="capacite" header="Capacité" [sortable]="true" [resizable]="true" dataType="number"></igx-column>
      <igx-column field="capacite_exam" header="Capacité Exam" [sortable]="true" [resizable]="true" dataType="number"></igx-column>
      <igx-column field="categorie" header="Catégorie" [sortable]="true" [resizable]="true"></igx-column>
<igx-column
    field="specifications"
    header="Spécifications"
    [sortable]="true"
    [resizable]="true">

    <ng-template igxCell let-cell="cell">
        {{ formatSpecifications(cell.value) }}
    </ng-template>

</igx-column>
      <igx-column field="surface" header="Surface" [sortable]="true" [resizable]="true" dataType="number">
          <ng-template igxCell let-cell="cell">
              {{ cell.value }} m²
          </ng-template>
      </igx-column>

      <igx-column field="etage" header="Étage" [sortable]="true" [resizable]="true"></igx-column>

      <igx-column field="faculte.intitule" header="Faculté" [sortable]="true" [resizable]="true">
          <ng-template igxCell let-cell="cell">
              {{ cell.row.data.faculte?.intitule || '—' }}
          </ng-template>
      </igx-column>

      <igx-column field="batiment.intitule" header="Bâtiment" [sortable]="true" [resizable]="true">
          <ng-template igxCell let-cell="cell">
              {{ cell.row.data.batiment?.intitule || '—' }}
          </ng-template>
      </igx-column>

      <igx-column field="batiment.etat" header="Etat" [sortable]="true" [resizable]="true">
    <ng-template igxCell let-cell="cell">
        <span [ngClass]="cell.row.data.etat ? 'etat-active' : 'etat-inactive'">
          {{ cell.row.data.etat ? 'Active' : 'Désactivée' }}
        </span>
    </ng-template>
</igx-column>

     
  <igx-action-strip #actionStrip>
    <igx-grid-pinning-actions></igx-grid-pinning-actions>
    <button
        igxIconButton="flat"
        igxRipple
        [igxTooltipTarget]="tooltipEdit"
        (click)="openEditDialog(actionStrip.context.data.id)">
        <igx-icon>edit</igx-icon>
    </button>
    <span #tooltipEdit="tooltip" igxTooltip>Modifier</span>
 <button
    igxIconButton="flat"
    igxRipple
    [igxTooltipTarget]="tooltipEtat"
    [style.width.px]="40"
    [style.height.px]="40"
    style="display:flex; align-items:center; justify-content:center;"
    (click)="changerEtat(actionStrip.context?.data)">
    <igx-icon
        [style.font-size.px]="26"
        [style.width.px]="26"
        [style.height.px]="26"
        [ngStyle]="{ color: actionStrip.context?.data?.etat ? '#22c55e' : '#ef4444' }">
      {{ actionStrip.context?.data?.etat ? 'toggle_on' : 'toggle_off' }}
    </igx-icon>
</button>
<span #tooltipEtat="tooltip" igxTooltip>
  {{ actionStrip.context?.data?.etat ? 'Désactiver' : 'Activer' }}
</span>
</igx-action-strip>

      <igx-paginator [perPage]="15"></igx-paginator>

  </igx-grid>
 <igx-dialog #createDialog title="Ajouter une salle" closeOnOutsideSelect="true">
    <app-salle-create
        (saved)="onSalleSaved()"
        (cancelled)="onCreateCancelled()">
    </app-salle-create>
  </igx-dialog>
  <igx-dialog #editDialog title="Modifier la salle" closeOnOutsideSelect="true">
  <app-salle-edit
      [id]="selectedSalleId"
      (saved)="onSalleUpdated()"
      (cancelled)="onEditCancelled()">
  </app-salle-edit>
</igx-dialog>
</div>
