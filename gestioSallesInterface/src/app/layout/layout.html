<div class="app-shell">
  <header class="topbar">
    <button class="menu-toggle" (click)="toggleSidebar()" [attr.aria-expanded]="isSidebarOpen()">
      <i class="bi" [class.bi-list]="!isSidebarOpen()" [class.bi-x-lg]="isSidebarOpen()"></i>
    </button>
    <a routerLink="/dashboard" class="topbar-brand">
      <i class="bi bi-building"></i>
      <span>Gestion des salles</span>
    </a>
  </header>

  <div class="sidebar-overlay" [class.visible]="isSidebarOpen()" (click)="closeSidebar()"></div>

  <aside class="sidebar" [class.open]="isSidebarOpen()">
    <div class="sidebar-brand">
      <a routerLink="/salles" (click)="closeSidebar()">
        <i class="bi bi-building"></i>
        <span>Gestion des salles</span>
      </a>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-label">Menu</span>
      <ul>
        
        <li>
          <a routerLink="/salles" routerLinkActive="active" (click)="closeSidebar()">
            <i class="bi bi-door-open"></i>
            <span>Salles</span>
          </a>
        </li>
         <li>
          <a routerLink="/batiments" routerLinkActive="active" (click)="closeSidebar()">
            <i class="bi bi-door-open"></i>
            <span>Batiments</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <div class="main-area">
    <div class="content-container">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
