<form class="app-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <h2>Modifier un bâtiment</h2>

  <div class="app-field">
    <label for="intitule">Intitulé</label>
    <input id="intitule" type="text" formControlName="intitule" placeholder="Nom du bâtiment" />
    <span class="app-field-error" *ngIf="f.intitule.invalid && f.intitule.touched">
      <span *ngIf="f.intitule.errors?.['required']">L'intitulé est requis.</span>
      <span *ngIf="f.intitule.errors?.['maxlength']">L'intitulé est trop long.</span>
    </span>
  </div>
   <div class="app-field">
    <label for="description">Description</label>
    <input id="description" type="text" formControlName="description" placeholder="Description du bâtiment" />
    <span class="app-field-error" *ngIf="f.description.invalid && f.description.touched">
      <span *ngIf="f.description.errors?.['maxlength']">La description est trop long.</span>
    </span>
  </div>
  <div class="app-field">
    <label>Choisir l'emplacement (cliquez sur la carte)</label>
    <div id="map" #mapContainer></div>
  </div>

  <div class="app-field-row">
    <div class="app-field">
      <label for="latitude">Latitude</label>
      <input id="latitude" type="number" step="any" formControlName="latitude" readonly />
      <span class="app-field-error" *ngIf="f.latitude.invalid && f.latitude.touched">
        <span *ngIf="f.latitude.errors?.['required']">La latitude est requise.</span>
        <span *ngIf="f.latitude.errors?.['min'] || f.latitude.errors?.['max']">Latitude invalide (-90 à 90).</span>
      </span>
    </div>

    <div class="app-field">
      <label for="longitude">Longitude</label>
      <input id="longitude" type="number" step="any" formControlName="longitude" readonly />
      <span class="app-field-error" *ngIf="f.longitude.invalid && f.longitude.touched">
        <span *ngIf="f.longitude.errors?.['required']">La longitude est requise.</span>
        <span *ngIf="f.longitude.errors?.['min'] || f.longitude.errors?.['max']">Longitude invalide (-180 à 180).</span>
      </span>
    </div>
  </div>

  <span class="app-field-error" *ngIf="error">{{ error }}</span>

  <div class="app-form-actions">
    <button type="button" (click)="onCancel()">Annuler</button>
    <button type="submit" [disabled]="submitting">
      {{ submitting ? 'Enregistrement...' : 'Enregistrer les modifications' }}
    </button>
  </div>
</form>
